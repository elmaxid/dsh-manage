name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxis (bash -n)
        run: bash -n dsh-manage.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          files: dsh-manage.sh

      - name: Batería de tests (bats-core)
        uses: bats-core/bats-action@2.0.0
        with:
          working-directory: .
