name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxis (bash -n)
        run: bash -n dsh-manage.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: dsh-manage.sh

      - name: Batería de tests (bats-core)
        uses: bats-core/bats-action@2.0.0

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # escanear todo el historial, no solo el último commit

      - name: Gitleaks (scan de secretos sobre todo el historial)
        run: |
          set -euo pipefail
          VERSION=v8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source=. --verbose --redact
